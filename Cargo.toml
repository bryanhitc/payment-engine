[package]
name = "payment-engine"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.105"
crossbeam = { version = "0.8.5", optional = true }
csv = "1.4.0"
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
googletest = "0.14.4"
serde_test = "1.0.177"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[features]
default = ["serial"]
serial = []
stream = ["dep:crossbeam"]
